name: Build APK

on:
  push:
    branches: [main]
    # Season data updates don't need a new APK
    paths-ignore: [season.json, tools/**, .github/workflows/season.yml]
  workflow_dispatch:

permissions:
  contents: write

# Two pushes close together must not replace the release at the same time
concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk d4-boss-alarm.apk
          # Unsigned Play bundle; it is signed with the upload key outside the repo
          cp app/build/outputs/bundle/release/app-release.aab d4-boss-alarm-unsigned.aab

      - uses: actions/upload-artifact@v4
        with:
          name: d4-boss-alarm
          path: d4-boss-alarm.apk

      # Keep one "latest" release so the phone always has the same download link
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Remove the previous "latest" release, including any draft left by an interrupted run
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name == "latest" or .draft) | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          git push --delete origin latest || true
          # Publish first, then attach the APK, so the release is never left as a draft
          gh release create latest \
            --title "최신 버전" \
            --notes "빌드: ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA" \
            --latest
          gh release upload latest d4-boss-alarm.apk --clobber
          # Some gh versions leave the release as a draft after an upload; publish it explicitly
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name == "latest") | .id' | head -1)
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false -f make_latest=true --jq '.draft'
          sleep 3
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq '.draft')
          echo "draft=$draft"
          [ "$draft" = "false" ]

      # Releases sometimes flip back to draft (404), so also keep the APK on its own branch:
      # https://github.com/<owner>/<repo>/raw/apk/d4-boss-alarm.apk
      - name: Publish APK branch
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir apk-out
          cp d4-boss-alarm.apk d4-boss-alarm-unsigned.aab apk-out/
          cd apk-out
          git init -q -b apk
          git add d4-boss-alarm.apk d4-boss-alarm-unsigned.aab
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "APK build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk
