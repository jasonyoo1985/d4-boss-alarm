name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Two pushes close together must not replace the release at the same time
concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk d4-boss-alarm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: d4-boss-alarm
          path: d4-boss-alarm.apk

      # Keep one "latest" release so the phone always has the same download link
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Remove the previous "latest" release, including any draft left by an interrupted run
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name == "latest" or .draft) | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          git push --delete origin latest || true
          gh release create latest d4-boss-alarm.apk \
            --title "최신 버전" \
            --notes "빌드: ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA"
