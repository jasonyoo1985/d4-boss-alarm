name: probe
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe.yml']
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/maven-metadata.xml | grep -oE "<version>(8\.1[0-9]|9\.[0-4])\.[0-9]+</version>" | tr '\n' ' '
          echo; curl -sL https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-gradle-plugin/maven-metadata.xml | grep -oE "<version>(1\.9|2\.[0-3])\.[0-9]+</version>" | tail -12 | tr '\n' ' '
          echo; curl -sL https://dl.google.com/dl/android/maven2/androidx/core/core/maven-metadata.xml | grep -E "<release>"
